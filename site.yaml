    antetitulo: Preguntas frecuentes
    titulo: Lo que nos preguntáis antes de venir
    texto: "¿Tienes otra duda? Llámanos o escríbenos por WhatsApp y te contestamos en el día."
    preguntas:
      - { pregunta: ¿La primera visita es de verdad gratis?, respuesta: "Sí. Incluye la revisión, las fotos y el plan de tratamiento con su presupuesto. Si no quieres tratarte con nosotros, no pagas nada." }
      - { pregunta: ¿Atendéis urgencias?, respuesta: "Sí. Si tienes dolor, una pieza rota o una infección, llámanos y te vemos el mismo día dentro de nuestro horario." }
      - { pregunta: ¿Cómo funciona la financiación?, respuesta: "Te damos el presupuesto cerrado, eliges el número de cuotas y la respuesta llega en el día. Los tratamientos de hasta 12 meses no tienen intereses." }
      - { pregunta: ¿A qué edad conviene la primera visita del niño?, respuesta: "Hacia los tres años, o antes si ves manchas o algo que te preocupe. La revisión de ortodoncia, sobre los seis o siete años." }
